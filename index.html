<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>財表理論 学習帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-deep:#F4F3EE;
    --line:#D8D4C4;
    --line-soft:#EDEBE1;
    --ink:#1E2A3C;
    --ink-soft:#5B6472;
    --ink-faint:#8A8F80;
    --hanko:#A73B2C;
    --hanko-soft:rgba(167,59,44,0.10);
    --hanko-line:rgba(167,59,44,0.35);
    --gold:#8B7332;
    --ok:#3B6B4A;
    --ok-soft:rgba(59,107,74,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, transparent, transparent 37px, var(--line-soft) 37px, var(--line-soft) 38px),
      var(--paper);
    color:var(--ink);
    font-family:"Noto Sans JP", sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:24px 18px 80px;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:3px double var(--ink);
    padding-bottom:10px;
    margin-bottom:22px;
  }
  header.top .title{
    font-family:"Noto Serif JP", serif;
    font-weight:900;
    font-size:22px;
    letter-spacing:.04em;
  }
  header.top .title small{
    display:block;
    font-family:"Noto Sans JP", sans-serif;
    font-weight:400;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.12em;
    margin-top:2px;
  }
  .ledger-no{
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    color:var(--ink-faint);
    font-size:12px;
  }
  a{color:inherit;text-decoration:none;}
  .crumb{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:16px;
    display:flex;
    gap:6px;
    align-items:center;
  }
  .crumb a{border-bottom:1px solid var(--line);}
  .crumb a:hover{border-color:var(--ink);}

  /* ---- Unit list (ledger rows) ---- */
  .unit-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background .15s ease;
  }
  .unit-row:hover{background:var(--paper-deep);}
  .unit-row .no{
    font-family: ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size:13px;
    color:var(--gold);
    width:28px;
    flex:none;
  }
  .unit-row .body{flex:1; min-width:0;}
  .unit-row .name{
    font-family:"Noto Serif JP", serif;
    font-weight:700;
    font-size:16px;
    margin-bottom:4px;
  }
  .unit-row .meta{
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .unit-row .score{
    font-family: ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size:13px;
    color:var(--ink-soft);
    flex:none;
    text-align:right;
  }
  .unit-row .score b{color:var(--hanko); font-weight:700;}
  .unit-row .chev{color:var(--ink-faint); flex:none;}

  .summary-strip{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--ink-faint);
    margin-bottom:14px;
    font-family: ui-monospace, monospace;
  }

  .category-block{ margin-bottom:4px; border-bottom:1px solid var(--line); }
  .category-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 6px;
    cursor:pointer;
  }
  .category-header:hover{ background:var(--paper-deep); }
  .cat-arrow{
    font-size:11px;
    color:var(--gold);
    transition:transform .15s ease;
    flex:none;
    display:inline-block;
  }
  .cat-arrow.open{ transform:rotate(90deg); }
  .cat-name{
    font-family:"Noto Serif JP", serif;
    font-weight:700;
    font-size:16px;
    flex:1;
  }
  .cat-meta{
    font-size:11px;
    color:var(--ink-faint);
    font-family: ui-monospace, monospace;
    flex:none;
  }
  .category-body{ padding-left:4px; }

  .section-block{ margin-bottom:6px; }
  .section-title{
    font-family:"Noto Serif JP", serif;
    font-weight:700;
    font-size:14px;
    color:var(--ink);
    background:var(--paper-deep);
    padding:8px 10px;
    margin-top:22px;
    border-left:4px solid var(--gold);
    letter-spacing:.02em;
  }
  .section-block:first-child .section-title{ margin-top:8px; }

  /* ---- Question list ---- */
  .q-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .q-row:hover{background:var(--paper-deep);}
  .tag{
    flex:none;
    font-size:10.5px;
    font-weight:700;
    padding:3px 7px;
    border-radius:2px;
    letter-spacing:.03em;
    border:1px solid currentColor;
  }
  .tag.blank{color:var(--gold);}
  .tag.desc{color:#3A5A78;}
  .q-row .qtext{
    flex:1;
    min-width:0;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:var(--ink);
  }
  .q-row .stamp-mini{flex:none;}

  .stamp-mini{
    width:30px;height:30px;
    border-radius:50%;
    border:2px solid transparent;
    display:flex;align-items:center;justify-content:center;
    font-family:"Noto Serif JP", serif;
    font-weight:900;
    font-size:12px;
  }
  .stamp-mini.correct{border-color:var(--hanko); color:var(--hanko); background:var(--hanko-soft); transform:rotate(-6deg);}
  .stamp-mini.partial{border-color:var(--gold); color:var(--gold); background:rgba(139,115,50,0.10); transform:rotate(-4deg);}
  .stamp-mini.incorrect{border-color:var(--ink-faint); color:var(--ink-faint); background:transparent;}
  .stamp-mini.none{border-color:var(--line); color:var(--line);}

  /* ---- Filter bar ---- */
  .filter-bar{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .filter-group{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-items:center;
  }
  .filter-group .flabel{
    font-size:11px;
    color:var(--ink-faint);
    width:44px;
    flex:none;
  }
  .chip{
    font-family:"Noto Sans JP", sans-serif;
    font-size:12px;
    padding:6px 12px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    border-radius:999px;
    cursor:pointer;
  }
  .chip:hover{border-color:var(--ink);}
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .chip.active.st-correct{ background:var(--hanko); border-color:var(--hanko); }
  .chip.active.st-partial{ background:var(--gold); border-color:var(--gold); }
  .chip.active.st-incorrect{ background:var(--ink-soft); border-color:var(--ink-soft); }

  /* ---- Question solve view ---- */
  .q-head{
    margin-bottom:18px;
  }
  .q-head .tag{margin-bottom:8px; display:inline-block;}
  .q-heading{
    font-size:12px;
    color:var(--gold);
    font-weight:700;
    letter-spacing:.04em;
    margin-bottom:6px;
  }
  .q-head .stem{
    font-family:"Noto Serif JP", serif;
    font-size:17px;
    line-height:1.9;
    font-weight:500;
  }
  .blank-input{
    border:none;
    border-bottom:2px solid var(--ink);
    background:transparent;
    font-family:"Noto Sans JP", sans-serif;
    font-size:15px;
    padding:2px 4px;
    width:7em;
    min-width:3em;
    max-width:100%;
    color:var(--ink);
    text-align:center;
    box-sizing:border-box;
  }
  .blank-input:focus{outline:none; border-color:var(--hanko);}
  .blank-input.ok{border-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
  .blank-input.ng{border-color:var(--hanko); color:var(--hanko); background:var(--hanko-soft);}
  .blank-input[readonly]{ cursor:default; }

  .blank-slot{
    display:inline-flex;
    align-items:center;
    gap:3px;
    vertical-align:middle;
  }
  .reveal-single{
    flex:none;
    width:20px;
    height:20px;
    border-radius:50%;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold);
    font-size:11px;
    font-weight:700;
    line-height:1;
    cursor:pointer;
    padding:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .reveal-single:hover{ background:rgba(139,115,50,0.12); }
  .reveal-single.used{
    border-color:var(--line);
    color:var(--line);
    cursor:default;
  }
  .reveal-single.used:hover{ background:transparent; }

  textarea.answer-box{
    width:100%;
    min-height:120px;
    font-family:"Noto Sans JP", sans-serif;
    font-size:14px;
    line-height:1.8;
    padding:12px;
    border:1px solid var(--line);
    background:#fffdf8;
    border-radius:2px;
    resize:vertical;
    color:var(--ink);
  }
  textarea.answer-box:focus{outline:none; border-color:var(--ink);}

  .btn{
    font-family:"Noto Sans JP", sans-serif;
    font-size:13.5px;
    font-weight:700;
    padding:10px 18px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    border-radius:2px;
    letter-spacing:.02em;
  }
  .btn:hover{background:var(--ink); color:var(--paper);}
  .btn.primary{background:var(--ink); color:var(--paper);}
  .btn.primary:hover{opacity:.85;}
  .btn-row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}

  .btn-stamp{
    font-family:"Noto Serif JP", serif;
    font-weight:900;
    font-size:13px;
    padding:10px 16px;
    border-radius:2px;
    cursor:pointer;
    letter-spacing:.05em;
  }
  .btn-stamp.correct{
    border:2px solid var(--hanko); color:var(--hanko); background:transparent;
  }
  .btn-stamp.correct:hover{background:var(--hanko-soft);}
  .btn-stamp.partial{
    border:2px solid var(--gold); color:var(--gold); background:transparent;
  }
  .btn-stamp.partial:hover{background:rgba(139,115,50,0.10);}
  .btn-stamp.incorrect{
    border:2px solid var(--ink-faint); color:var(--ink-soft); background:transparent;
  }
  .btn-stamp.incorrect:hover{background:var(--paper-deep);}

  .panel{
    margin-top:20px;
    padding:16px;
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:2px;
  }
  .panel .label{
    font-size:11px;
    color:var(--gold);
    font-weight:700;
    letter-spacing:.1em;
    margin-bottom:8px;
  }
  .panel .content{
    font-size:14px;
    line-height:1.9;
    white-space:pre-wrap;
  }

  .verdict-banner{
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    border-radius:2px;
  }
  .verdict-banner.result-correct{background:var(--hanko-soft); border:1px solid var(--hanko-line);}
  .verdict-banner.result-partial{background:rgba(139,115,50,0.08); border:1px solid rgba(139,115,50,0.35);}
  .verdict-banner.result-incorrect{background:var(--paper-deep); border:1px solid var(--line);}
  .verdict-stamp{
    width:52px;height:52px;
    border-radius:50%;
    border:3px solid var(--hanko);
    color:var(--hanko);
    display:flex;align-items:center;justify-content:center;
    font-family:"Noto Serif JP", serif;
    font-weight:900;
    font-size:18px;
    flex:none;
    transform:rotate(-8deg);
    animation:stamp-in .28s cubic-bezier(.2,1.4,.6,1);
  }
  .verdict-stamp.partial{border-color:var(--gold); color:var(--gold);}
  .verdict-stamp.incorrect{border-color:var(--ink-faint); color:var(--ink-soft);}
  @keyframes stamp-in{
    0%{transform:scale(1.8) rotate(-8deg); opacity:0;}
    100%{transform:scale(1) rotate(-8deg); opacity:1;}
  }
  .verdict-text{font-size:13px; color:var(--ink-soft); line-height:1.6;}
  .verdict-text b{color:var(--ink); font-family:"Noto Serif JP",serif;}

  .nav-foot{
    display:flex;
    justify-content:space-between;
    margin-top:28px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .nav-foot a, .nav-foot button{
    font-size:12.5px;
    color:var(--ink-soft);
    background:none;
    border:none;
    cursor:pointer;
    font-family:"Noto Sans JP", sans-serif;
  }
  .nav-foot a:hover, .nav-foot button:hover{color:var(--ink);}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-faint);
    font-size:13px;
  }

  @media (max-width:480px){
    .wrap{padding:18px 14px 70px;}
    header.top .title{font-size:19px;}
    .q-row .qtext{font-size:13px;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   財表理論 学習帳 — データ本体
   ---------------------------------------------------------
   単元(unit)ごとに questions 配列を持つ。
   type: "blank"（穴埋め） or "desc"（記述）

   ■ blank型のtext記法
     文中の空欄位置を {{}} で示す。出現順に blanks[] と対応する。
     blanks[i] は許容解答の配列（表記ゆれ・別解を複数入れてよい）。
     例: text: "資産とは、過去の取引の結果として{{}}が支配し、
              {{}}が期待される経済的資源をいう。"
         blanks: [["企業"], ["将来の経済的便益の流入"]]

   ■ desc型
     text に問題文、modelAnswer に模範解答（自己採点用）を書く。

   このDATA配列を書き換えるだけで単元・問題を追加/編集できる。
   ========================================================= */

        blanks: [["会計責任"], ["意思決定有用性"]]
      },
      {
        id: "dento_01_q03",
        type: "blank",
        section: "１．財務会計",
        heading: "財務会計の機能２つ",
        text: "財務会計の果たすべき役割（機能）は２つある。会計責任説から導かれるのが{{}}機能であり、意思決定有用性説から導かれるのが{{}}機能である。",
        blanks: [["利害調整"], ["情報提供"]]
      },
      {
        id: "dento_01_q04",

        blanks: [["分配可能性"], ["業績指標性"]]
      },
      {
        id: "dento_01_q05",
        type: "blank",
        section: "１．財務会計",
        heading: "財務会計の目的（会計責任説）",
        text: "経営者は、{{}}及び債権者に対して{{}}を行う責任があり、その{{}}を遂行することが財務会計の目的である。",
        blanks: [["株主"], ["会計報告"], ["会計責任"]]
      },
      {
        id: "dento_01_q06",
        type: "blank",
        section: "１．財務会計",

      {

        blanks: [["利害関係者"], ["利害"], ["調整"]]
      },
      {
        id: "dento_01_q08",
        type: "blank",
        section: "１．財務会計",

        text: "情報提供機能とは、{{}}の{{}}に役立つ{{}}を提供する機能をいう。",
        blanks: [["投資家"], ["経済的意思決定"], ["有用な情報"]]
      },
      {

      {

      {

        blanks: [["分配可能"], ["適正"], ["期間損益計算"]]
      },
      {

      },
      {
        id: "dento_01_q15",
        type: "blank",
        section: "２．制度会計",
        heading: "制度会計の種類",
        text: "財務会計において重視される制度会計は、すべての会社に適用される{{}}会計と上場会社等に適用される{{}}会計である。",
        blanks: [["会社法"], ["金融商品取引法"]]
      },
      {
        id: "dento_01_q16",
        type: "blank",
        section: "２．制度会計",

/* ---------------- 進捗ストレージ ---------------- */
const STORAGE_KEY = "zaihyoTheoryProgress_v1";
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveProgress(qid, status){
  const p = loadProgress();
  p[qid] = status; // "correct" | "incorrect"
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
function getStatus(qid){
  return loadProgress()[qid] || null;
}

/* ---------------- ユーティリティ ---------------- */
function normalize(str){
  return (str || "")
    .toString()
    .trim()
    .replace(/\s+/g, "")
    .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[Ａ-Ｚａ-ｚ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
}
function findUnit(unitId){ return DATA.find(u => u.id === unitId); }
function findQuestion(unitId, qid){
  const u = findUnit(unitId);
  return u ? u.questions.find(q => q.id === qid) : null;
}
function unitStats(unit){
  const p = loadProgress();
  let correct = 0, partial = 0, incorrect = 0, answered = 0;
  unit.questions.forEach(q => {
    const s = p[q.id];
    if(s){
      answered++;
      if(s === "correct") correct++;
      else if(s === "partial") partial++;
      else if(s === "incorrect") incorrect++;
    }
  });
  return { total: unit.questions.length, answered, correct, partial, incorrect };
}
function escapeHtml(s){
  return (s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ---------------- 単元詳細のフィルター状態 ---------------- */
// ページ遷移中は保持し、別の単元に移動したらリセットする
let currentFilterUnitId = null;
let filterState = { type: "all", status: "all" };
function ensureFiltersForUnit(unitId){
  if(currentFilterUnitId !== unitId){
    currentFilterUnitId = unitId;
    filterState = { type: "all", status: "all" };
  }
}

/* ---------------- ルーター ---------------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  if(parts.length === 0) return { view: "units" };
  if(parts[0] === "unit" && parts[1]) return { view: "unit", unitId: parts[1] };
  if(parts[0] === "q" && parts[1] && parts[2]) return { view: "question", unitId: parts[1], qid: parts[2] };
  return { view: "units" };
}
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

/* ---------------- レンダリング ---------------- */
function render(){
  const route = parseHash();
  const app = document.getElementById("app");
  if(route.view === "units") app.innerHTML = viewUnitList();
  else if(route.view === "unit") app.innerHTML = viewUnitDetail(route.unitId);
  else if(route.view === "question") app.innerHTML = viewQuestion(route.unitId, route.qid);
  window.scrollTo(0,0);
  bindEvents(route);
}

    }).join("");

    return `
      <div class="category-block">
        <div class="category-header" data-toggle-category="${escapeHtml(cat)}">
          <span class="cat-arrow ${isOpen ? 'open' : ''}">▸</span>
          <span class="cat-name">${escapeHtml(cat)}</span>
          <span class="cat-meta">${units.length}単元・${catQ}問・${catCorrect}正解</span>
        </div>
        <div class="category-body" style="display:${isOpen ? 'block' : 'none'}">
          ${rows}
        </div>
      </div>`;
  }).join("");

  return `
    <header class="top">
      <div class="title">財表理論 学習帳<small>UNIT SELECT — 財務諸表論</small></div>
      <div class="ledger-no">No.${String(DATA.length).padStart(2,"0")}</div>
    </header>
    <div class="summary-strip">
      <span>全${totalQ}問</span>
      <span>解答済 ${totalAnswered}問</span>
      <span>正解 ${totalCorrect}問</span>
    </div>
    <div>${catBlocks || `<div class="empty">単元データがありません</div>`}</div>
  `;
}

function viewUnitDetail(unitId){
  const unit = findUnit(unitId);
  if(!unit) return `<div class="empty">単元が見つかりません</div>`;
  const st = unitStats(unit);
  ensureFiltersForUnit(unitId);

  const matchesFilter = (q) => {
    if(filterState.type !== "all" && q.type !== filterState.type) return false;
    if(filterState.status !== "all"){
      const s = getStatus(q.id);
      if(filterState.status === "none" && s) return false;
      if(filterState.status !== "none" && s !== filterState.status) return false;
    }
    return true;
  };

  // section ごとにグループ化（登場順を維持）
  const groups = [];
  const groupIndex = {};
  unit.questions.forEach(q => {
    const key = q.section || "";
    if(!(key in groupIndex)){
      groupIndex[key] = groups.length;
      groups.push({ section: key, items: [] });
    }
    groups[groupIndex[key]].items.push(q);
  });

  const filterBar = `
    <div class="filter-bar">
      <div class="filter-group">
        <span class="flabel">種別</span>
        ${chip("type","all","すべて")}
        ${chip("type","blank","穴埋め")}
        ${chip("type","desc","記述")}
      </div>
      <div class="filter-group">
        <span class="flabel">状態</span>
        ${chip("status","all","すべて")}
        ${chip("status","none","未回答")}
        ${chip("status","correct","正解","st-correct")}
        ${chip("status","partial","曖昧","st-partial")}
        ${chip("status","incorrect","不正解","st-incorrect")}
      </div>
    </div>
  `;

  const groupsHtml = groups.map(g => {
    const filteredItems = g.items.filter(matchesFilter);
    if(filteredItems.length === 0) return "";
    const rows = filteredItems.map(q => {
      const status = getStatus(q.id);
      const stampClass = status === "correct" ? "correct" : status === "partial" ? "partial" : status === "incorrect" ? "incorrect" : "none";
      const stampChar = status === "correct" ? "正" : status === "partial" ? "△" : status === "incorrect" ? "誤" : "未";
      const preview = q.heading
        ? q.heading
        : (q.type === "blank" ? q.text.replace(/\{\{\}\}/g, "＿＿") : q.text);
      return `
        <div class="q-row" data-nav="#/q/${unit.id}/${q.id}">
          <span class="tag ${q.type === 'blank' ? 'blank' : 'desc'}">${q.type === 'blank' ? '穴埋め' : '記述'}</span>
          <span class="qtext">${escapeHtml(preview)}</span>
          <span class="stamp-mini ${stampClass}">${stampChar}</span>
        </div>`;
    }).join("");
    return `
      <div class="section-block">
        ${g.section ? `<div class="section-title">${escapeHtml(g.section)}</div>` : ""}
        ${rows}
      </div>`;
  }).join("");

  const hasAnyResults = groups.some(g => g.items.some(matchesFilter));

  return `
    <div class="crumb"><a href="#/">単元一覧</a><span>/</span><span>${escapeHtml(unit.title)}</span></div>
    <header class="top" style="border-bottom:1px solid var(--line); padding-bottom:8px;">
      <div class="title" style="font-size:18px;">${escapeHtml(unit.title)}</div>
      <div class="ledger-no">${st.correct}/${st.total} 正解</div>
    </header>
    ${filterBar}
    <div>${hasAnyResults ? groupsHtml : `<div class="empty">条件に一致する問題がありません</div>`}</div>
    <div class="nav-foot">
      <a href="#/">← 単元一覧へ戻る</a>
      <span></span>
    </div>
  `;
}

function chip(group, value, label, extraClass){
  const active = filterState[group] === value;
  return `<button class="chip ${active ? 'active ' + (extraClass||'') : ''}" data-filter-group="${group}" data-filter-value="${value}">${label}</button>`;
}

function viewQuestion(unitId, qid){
  const unit = findUnit(unitId);
  const q = findQuestion(unitId, qid);
  if(!unit || !q) return `<div class="empty">問題が見つかりません</div>`;

  const status = getStatus(q.id);

  if(q.type === "blank"){
    const parts = q.text.split("{{}}");
    let stem = "";
    parts.forEach((part, i) => {
      stem += escapeHtml(part).replace(/\n/g, "<br>");
      if(i < parts.length - 1){
        stem += `<span class="blank-slot" data-slot="${i}"><input type="text" class="blank-input" data-blank="${i}" autocomplete="off"><button type="button" class="reveal-single" data-blank="${i}" title="この空欄の解答を見る">?</button></span>`;
      }
    });
    return `
      ${crumbBar(unit, q)}
      <div class="q-head">
        <span class="tag blank">穴埋め</span>
        ${q.heading ? `<div class="q-heading">◆ ${escapeHtml(q.heading)}</div>` : ""}
        <div class="stem">${stem}</div>
      </div>
      <div style="font-size:11px; color:var(--ink-faint); margin-top:6px;">空欄横の「?」をタップするとその空欄だけ解答が見られます。</div>
      <div class="btn-row">
        <button class="btn primary" id="checkBlanks">採点する</button>
      </div>
      <div id="blankResult"></div>
      ${navFoot(unit, q)}
    `;
  }

  // 記述式
  return `
    ${crumbBar(unit, q)}
    <div class="q-head">
      <span class="tag desc">記述</span>
      ${q.heading ? `<div class="q-heading">◆ ${escapeHtml(q.heading)}</div>` : ""}
      ${q.text ? `<div class="stem">${escapeHtml(q.text)}</div>` : ""}
    </div>
    <textarea class="answer-box" id="descAnswer" placeholder="ここに自分の解答を書いてみましょう…"></textarea>
    <div class="btn-row">
      <button class="btn primary" id="revealAnswer">模範解答を見る</button>
    </div>
    <div id="modelAnswerPanel"></div>
    <div id="descVerdictArea"></div>
    ${navFoot(unit, q)}
  `;
}

function crumbBar(unit, q){
  return `<div class="crumb">
    <a href="#/">単元一覧</a><span>/</span>
    <a href="#/unit/${unit.id}">${escapeHtml(unit.title)}</a><span>/</span>
    <span>${q.type === 'blank' ? '穴埋め' : '記述'}問題</span>
  </div>`;
}

function navFoot(unit, q){
  const idx = unit.questions.findIndex(x => x.id === q.id);
  const prev = unit.questions[idx-1];
  const next = unit.questions[idx+1];
  return `<div class="nav-foot">
    <a href="#/unit/${unit.id}">← 問題一覧へ戻る</a>
    <span style="display:flex; gap:16px;">
      ${prev ? `<a href="#/q/${unit.id}/${prev.id}">‹ 前の問題</a>` : ""}
      ${next ? `<a href="#/q/${unit.id}/${next.id}">次の問題 ›</a>` : ""}
    </span>
  </div>`;
}

/* ---------------- イベント処理 ---------------- */
function bindEvents(route){
  // クリックでの画面遷移（行クリック）
  document.querySelectorAll("[data-nav]").forEach(el => {
    el.addEventListener("click", () => { location.hash = el.getAttribute("data-nav"); });
  });

  // フィルターチップ
  document.querySelectorAll("[data-filter-group]").forEach(el => {
    el.addEventListener("click", () => {
      const group = el.getAttribute("data-filter-group");
      const value = el.getAttribute("data-filter-value");
      filterState[group] = value;
      render();
    });
  });

  // カテゴリの開閉
  document.querySelectorAll("[data-toggle-category]").forEach(el => {
    el.addEventListener("click", () => {
      const cat = el.getAttribute("data-toggle-category");
      if(openCategories.has(cat)) openCategories.delete(cat);
      else openCategories.add(cat);
      render();
    });
  });

  if(route.view !== "question") return;
  const unit = findUnit(route.unitId);
  const q = findQuestion(route.unitId, route.qid);
  if(!unit || !q) return;

  if(q.type === "blank"){
    const btn = document.getElementById("checkBlanks");
    if(btn) btn.addEventListener("click", () => gradeBlanks(unit, q));
    document.querySelectorAll(".reveal-single").forEach(revealBtn => {
      revealBtn.addEventListener("click", () => revealSingleBlank(q, revealBtn));
    });
  } else {
    const btn = document.getElementById("revealAnswer");
    if(btn) btn.addEventListener("click", () => revealModelAnswer(unit, q));
  }
}

function estimateInputWidthEm(text){
  let w = 0;
  for(const ch of (text || "")){
    const cp = ch.codePointAt(0);
    // 全角相当（ひらがな・カタカナ・漢字・全角記号など）は約1em、半角英数字等は約0.6em
    const isFullWidth = cp > 0x2000 && !(cp >= 0xFF61 && cp <= 0xFF9F);
    w += isFullWidth ? 1.05 : 0.6;
  }
  return Math.max(3, w + 1.8) + "em";
}

function revealSingleBlank(q, buttonEl){
  if(buttonEl.classList.contains("used")) return;
  const i = Number(buttonEl.dataset.blank);
  const slot = buttonEl.closest(".blank-slot");
  const input = slot ? slot.querySelector(".blank-input") : null;
  const accepted = q.blanks[i] || [];
  const answer = accepted[0] || "";
  if(input){
    input.value = answer;
    input.classList.remove("ng");
    input.classList.add("ok");
    input.readOnly = true;
    // 長い解答でも切れないよう、全角・半角を考慮して幅を可変にする
    input.style.width = estimateInputWidthEm(answer);
  }
  buttonEl.classList.add("used");
  buttonEl.textContent = "✓";
  buttonEl.title = "この空欄は表示済みです";
}

function gradeBlanks(unit, q){
  const inputs = document.querySelectorAll(".blank-input");
  let allCorrect = true;
  inputs.forEach(input => {
    const i = Number(input.dataset.blank);
    const accepted = q.blanks[i] || [];
    const val = normalize(input.value);
    const isOk = accepted.some(a => normalize(a) === val);
    input.classList.remove("ok","ng");
    input.classList.add(isOk ? "ok" : "ng");
    if(input.value.length > 0){
      input.style.width = estimateInputWidthEm(input.value);
    }
    if(!isOk) allCorrect = false;
  });

  const resultEl = document.getElementById("blankResult");
  resultEl.innerHTML = `
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn-stamp correct" id="markCorrect">正解として記録する</button>
      <button class="btn-stamp partial" id="markPartial">曖昧（△）として記録する</button>
      <button class="btn-stamp incorrect" id="markIncorrect">不正解として記録する</button>
    </div>
    <div style="font-size:12px; color:var(--ink-faint); margin-top:8px;">
      ${allCorrect ? "すべての空欄が一致しました。" : "一致していない空欄があります。表記ゆれの場合は自分の判断で記録してください。"}
    </div>
  `;
  document.getElementById("markCorrect").addEventListener("click", () => finalizeGrade(unit, q, "correct"));
  document.getElementById("markPartial").addEventListener("click", () => finalizeGrade(unit, q, "partial"));
  document.getElementById("markIncorrect").addEventListener("click", () => finalizeGrade(unit, q, "incorrect"));
}

function revealModelAnswer(unit, q){
  document.getElementById("modelAnswerPanel").innerHTML = `
    <div class="panel">
      <div class="label">模範解答</div>
      <div class="content">${escapeHtml(q.modelAnswer)}</div>
    </div>
  `;
  document.getElementById("descVerdictArea").innerHTML = `
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn-stamp correct" id="markCorrect">正解として記録する</button>
      <button class="btn-stamp partial" id="markPartial">曖昧（△）として記録する</button>
      <button class="btn-stamp incorrect" id="markIncorrect">不正解として記録する</button>
    </div>
  `;
  document.getElementById("markCorrect").addEventListener("click", () => finalizeGrade(unit, q, "correct"));
  document.getElementById("markPartial").addEventListener("click", () => finalizeGrade(unit, q, "partial"));
  document.getElementById("markIncorrect").addEventListener("click", () => finalizeGrade(unit, q, "incorrect"));
  document.getElementById("revealAnswer").style.display = "none";
}

function finalizeGrade(unit, q, status){
  saveProgress(q.id, status);
  const area = q.type === "blank" ? document.getElementById("blankResult") : document.getElementById("descVerdictArea");
  const bannerClass = status === "correct" ? "result-correct" : status === "partial" ? "result-partial" : "result-incorrect";
  const stampClass = status === "correct" ? "" : status === "partial" ? "partial" : "incorrect";
  const stampChar = status === "correct" ? "正" : status === "partial" ? "△" : "誤";
  const label = status === "correct" ? "記録しました：正解" : status === "partial" ? "記録しました：曖昧（要復習）" : "記録しました：不正解";
  area.innerHTML = `
    <div class="verdict-banner ${bannerClass}">
      <div class="verdict-stamp ${stampClass}">${stampChar}</div>
      <div class="verdict-text">
        <b>${label}</b><br>
        単元一覧・問題一覧のフィルターに反映されます。
      </div>
    </div>
  `;
}
</script>
